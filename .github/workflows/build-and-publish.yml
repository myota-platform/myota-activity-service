name: Build and publish activity service image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Start isolated JetStream broker
        run: docker run -d --name notification-tests -p 14222:4222 nats:2.10-alpine -js
      - name: Verify notification replica overlap and service regressions
        env:
          NATS_TEST_URL: nats://127.0.0.1:14222
        run: python -m unittest discover -s tests
  build-and-publish:
    needs: [test-notifications]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/myota-platform/myota-activity-service:latest
