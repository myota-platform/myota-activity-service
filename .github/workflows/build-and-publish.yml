name: Build and publish activity service image

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Start isolated JetStream broker
        run: docker run -d --name notification-tests -p 14222:4222 nats:2.10-alpine -js
      - name: Verify notification replica overlap and service regressions
        env:
          NATS_TEST_URL: nats://127.0.0.1:14222
        run: python -m unittest discover -s tests
  build-and-publish:
    needs: [test-notifications]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image-tags
        env:
          IMAGE_NAME: ghcr.io/myota-platform/myota-activity-service
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "tags=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "testing" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:testing"
              echo "${IMAGE_NAME}:testing-${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing') }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
